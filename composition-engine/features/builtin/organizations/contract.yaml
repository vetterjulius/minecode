provides:
  capabilities:
    - organizations
  entities:
    - name: Organization
      description: App organization (tenant)
      fields:
        - name: id
          type: uuid
          required: true
          description: Primary key
          generate: uuid
        - name: name
          type: string
          required: true
          description: Name of the organization
        - name: createdAt
          type: timestamp
          required: true
          description: Tenant creation timestamp
          generate: now
      access:
        scope: tenant
        field: id
        writes: server-only
        permissions:
          read: org.read
    - name: Membership
      description: User membership inside an organization
      fields:
        - name: id
          type: uuid
          required: true
          description: Primary key
          generate: uuid
        - name: organizationId
          type: uuid
          required: true
          description: Reference to Organization
          references:
            entity: Organization
            onDelete: cascade
        - name: userId
          type: uuid
          required: true
          description: Reference to User
          references:
            entity: Profile
            onDelete: cascade
        - name: role
          type: string
          required: true
          description: User role inside organization
        - name: createdAt
          type: timestamp
          required: true
          description: Membership assignment timestamp
          generate: now
      access:
        scope: tenant
        field: organizationId
        writes: server-only
        permissions:
          read: org.read
    - name: Invitation
      description: Organization join invitation
      fields:
        - name: id
          type: uuid
          required: true
          description: Primary key
          generate: uuid
        - name: organizationId
          type: uuid
          required: true
          description: Reference to Organization
          references:
            entity: Organization
            onDelete: cascade
        - name: email
          type: string
          required: true
          description: Recipient email address
        - name: role
          type: string
          required: true
          description: Target membership role
        - name: token
          type: string
          required: true
          description: Secure invitation token
          unique: true
        - name: expiresAt
          type: timestamp
          required: true
          description: Expiration timestamp
        - name: acceptedAt
          type: timestamp
          description: Set when the invitation was accepted; an invitation works only once
      access:
        scope: tenant
        field: organizationId
        writes: server-only
        permissions:
          read: org.invite
  permissions:
    - name: org.read
      description: Read organization details
    - name: org.write
      description: Modify organization details
    - name: org.invite
      description: Invite members to organization
  api:
    - name: ListOrganizations
      path: /api/organizations
      method: GET
      description: List organizations for current user.
      crud:
        entity: Organization
        operation: list
        include: [Membership]
      permission: org.read
    - name: CreateOrganization
      path: /api/organizations
      method: POST
      description: Create an organization; the caller becomes its owner.
      behavior: organizations.create
    - name: InviteMember
      path: /api/organizations/invite
      method: POST
      description: Invite a new member via email.
      behavior: organizations.invite
      permission: org.invite
    - name: AcceptInvitation
      path: /api/organizations/accept-invitation
      method: POST
      description: Accept an invitation by token and join the organization.
      behavior: organizations.accept-invitation
  ui:
    - name: OrganizationsDashboard
      route: organizations
      slot: main
      description: Multi-tenant workspace dashboard.
requires:
  features:
    - authentication
