provides:
  capabilities:
    - workspaces
  entities:
    - name: Workspace
      description: App workspace
      fields:
        - name: id
          type: uuid
          required: true
          description: Primary key
          generate: uuid
        - name: name
          type: string
          required: true
          description: Name of the workspace
        - name: organizationId
          type: uuid
          required: true
          description: Reference to Organization
          references:
            entity: Organization
            onDelete: cascade
        - name: createdAt
          type: timestamp
          required: true
          description: Workspace creation timestamp
          generate: now
      access:
        scope: tenant
        field: organizationId
  permissions:
    - name: workspace.read
      description: Read workspace details
    - name: workspace.write
      description: Modify workspace details
  api:
    - name: ListWorkspaces
      path: /api/workspaces
      method: GET
      description: List workspaces for an organization.
      crud:
        entity: Workspace
        operation: list
      permission: workspace.read
    - name: CreateWorkspace
      path: /api/workspaces
      method: POST
      description: Create a new workspace.
      crud:
        entity: Workspace
        operation: create
      permission: workspace.write
  ui:
    - name: WorkspacesDashboard
      route: workspaces
      slot: main
      description: Workspaces management dashboard.
requires:
  features:
    - database
    - organizations
