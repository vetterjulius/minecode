provides:
  capabilities:
    - storage
  entities:
    - name: File
      description: Uploaded file metadata tracking
      fields:
        - name: id
          type: uuid
          required: true
          description: Primary key
          generate: uuid
        - name: name
          type: string
          required: true
          description: Original name of the file
        - name: path
          type: string
          required: true
          description: Path of the file inside the storage bucket
        - name: size
          type: integer
          required: true
          description: File size in bytes
        - name: mimeType
          type: string
          required: true
          description: MIME type of the file
        - name: organizationId
          type: uuid
          required: false
          description: Reference to Organization
          references:
            entity: Organization
            onDelete: cascade
        - name: createdAt
          type: timestamp
          required: true
          description: Timestamp of file upload
          generate: now
      access:
        scope: tenant
        field: organizationId
        permissions:
          read: storage.read
          write: storage.write
  permissions:
    - name: storage.read
      description: Read storage and view files
    - name: storage.write
      description: Upload and delete files
  api:
    - name: ListFiles
      path: /api/storage/files
      method: GET
      description: List uploaded files of the organization.
      crud:
        entity: File
        operation: list
      permission: storage.read
    - name: UploadFile
      path: /api/storage/upload
      method: POST
      description: Upload a file to the storage system.
      behavior: storage.upload
      permission: storage.write
    - name: DeleteFile
      path: /api/storage/delete
      method: DELETE
      description: Delete an uploaded file.
      behavior: storage.delete
      permission: storage.write
  ui:
    - name: StorageDashboard
      route: storage
      slot: main
      description: File manager and upload UI.
requires:
  features:
    - database
