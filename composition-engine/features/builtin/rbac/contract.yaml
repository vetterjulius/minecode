provides:
  capabilities:
    - rbac
  entities:
    - name: Role
      description: User security group role
      fields:
        - name: id
          type: uuid
          required: true
          description: Primary key
          generate: uuid
        - name: name
          type: string
          required: true
          description: Unique identifier name of the role
          unique: true
        - name: description
          type: string
          required: false
          description: Friendly description of the role
      access:
        scope: authenticated-read
    - name: Permission
      description: Specific action permission key
      fields:
        - name: id
          type: uuid
          required: true
          description: Primary key
          generate: uuid
        - name: name
          type: string
          required: true
          description: Unique permission handle (e.g. user.create)
          unique: true
        - name: description
          type: string
          required: false
          description: Purpose description
      access:
        scope: authenticated-read
    - name: RolePermission
      description: Grants a permission to a role
      fields:
        - name: roleId
          type: uuid
          required: true
          primaryKey: true
          references:
            entity: Role
            onDelete: cascade
        - name: permissionId
          type: uuid
          required: true
          primaryKey: true
          references:
            entity: Permission
            onDelete: cascade
      access:
        scope: authenticated-read
  permissions:
    - name: rbac.read
      description: Read RBAC configurations
    - name: rbac.write
      description: Modify RBAC roles and permissions
  api:
    - name: ListRoles
      path: /api/rbac/roles
      method: GET
      description: List available system roles.
  ui:
    - name: RbacAdminPage
      route: rbac-admin
      slot: main
      description: Role and authorization admin page.
requires:
  features:
    - authentication
