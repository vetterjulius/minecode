provides:
  capabilities:
    - rbac
  entities:
    - name: Role
      description: Named bundle of permissions assigned to organization members
      fields:
        - name: name
          type: string
          required: true
          primaryKey: true
          description: Role name, matched against membership.role
        - name: description
          type: string
          required: false
          description: Friendly description of the role
      access:
        scope: authenticated-read
    - name: Permission
      description: Specific action permission key
      fields:
        - name: name
          type: string
          required: true
          primaryKey: true
          description: Unique permission handle (e.g. project.write)
        - name: description
          type: string
          required: false
          description: Purpose description
      access:
        scope: authenticated-read
    - name: RolePermission
      description: Grants a permission to a role
      fields:
        - name: role
          type: string
          required: true
          primaryKey: true
          description: Role name
          references:
            entity: Role
            column: name
            onDelete: cascade
        - name: permission
          type: string
          required: true
          primaryKey: true
          description: Permission name
          references:
            entity: Permission
            column: name
            onDelete: cascade
      access:
        scope: authenticated-read
  permissions:
    - name: rbac.read
      description: Read RBAC configurations
    - name: rbac.write
      description: Modify RBAC roles and permissions
  api:
    - name: ListRoles
      path: /api/rbac/roles
      method: GET
      description: List available system roles.
      crud:
        entity: Role
        operation: list
      permission: rbac.read
  ui:
    - name: RbacAdminPage
      route: rbac-admin
      slot: main
      description: Role and authorization admin page.
requires:
  features:
    - authentication
