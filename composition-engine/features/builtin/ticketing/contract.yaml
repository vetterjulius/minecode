provides:
  capabilities:
    - ticketing
  entities:
    - name: Ticket
      description: Customer support ticket tracking
      fields:
        - name: id
          type: uuid
          required: true
          description: Primary key
          generate: uuid
        - name: title
          type: string
          required: true
          description: Ticket short summary title
        - name: status
          type: string
          required: true
          description: Ticket state (open, in_progress, resolved, closed)
          default: open
        - name: priority
          type: string
          required: true
          description: Ticket urgency priority (low, medium, high, urgent)
          default: medium
        - name: assigneeId
          type: uuid
          required: false
          description: User ID of assigned staff support agent
          references:
            entity: Profile
            onDelete: set null
        - name: organizationId
          type: uuid
          required: true
          description: Reference to Organization
          references:
            entity: Organization
            onDelete: cascade
        - name: createdAt
          type: timestamp
          required: true
          description: Ticket creation timestamp
          generate: now
      access:
        scope: tenant
        field: organizationId
  permissions:
    - name: tickets.read
      description: View organization support tickets
    - name: tickets.write
      description: Create and update tickets
  api:
    - name: ListTickets
      path: /api/tickets
      method: GET
      description: List support tickets.
      crud:
        entity: Ticket
        operation: list
      permission: tickets.read
    - name: CreateTicket
      path: /api/tickets
      method: POST
      description: Submit a new support ticket.
      crud:
        entity: Ticket
        operation: create
      permission: tickets.write
  ui:
    - name: TicketInbox
      route: tickets
      slot: main
      description: Support agent ticket queue and filtering.
requires:
  features:
    - database
    - organizations
