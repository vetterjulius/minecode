provides:
  capabilities:
    - projects
  entities:
    - name: Project
      description: App project
      fields:
        - name: id
          type: uuid
          required: true
          description: Primary key
          generate: uuid
        - name: name
          type: string
          required: true
          description: Name of the project
        - name: description
          type: text
          required: false
          description: Optional description
        - name: status
          type: string
          required: true
          description: Project status (e.g. active, archived)
          default: active
        - name: organizationId
          type: uuid
          required: true
          description: Reference to Organization
          references:
            entity: Organization
            onDelete: cascade
        - name: workspaceId
          type: uuid
          required: true
          description: Reference to Workspace
          references:
            entity: Workspace
            onDelete: cascade
        - name: createdAt
          type: timestamp
          required: true
          description: Project creation timestamp
          generate: now
      access:
        scope: tenant
        field: organizationId
        permissions:
          read: project.read
          write: project.write
  permissions:
    - name: project.read
      description: Read project details
    - name: project.write
      description: Modify project details
  api:
    - name: ListProjects
      path: /api/projects
      method: GET
      description: List projects for a workspace.
      crud:
        entity: Project
        operation: list
      permission: project.read
    - name: CreateProject
      path: /api/projects
      method: POST
      description: Create a new project.
      crud:
        entity: Project
        operation: create
      permission: project.write
    - name: GetProject
      path: /api/projects/:id
      method: GET
      description: Fetch one project.
      crud:
        entity: Project
        operation: get
      permission: project.read
    - name: UpdateProject
      path: /api/projects/:id
      method: PATCH
      description: Update a project.
      crud:
        entity: Project
        operation: update
      permission: project.write
    - name: DeleteProject
      path: /api/projects/:id
      method: DELETE
      description: Delete a project.
      crud:
        entity: Project
        operation: delete
      permission: project.write
  ui:
    - name: ProjectsDashboard
      route: projects
      slot: main
      description: Projects management dashboard.
requires:
  features:
    - database
    - workspaces
