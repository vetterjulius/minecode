provides:
  capabilities:
    - authentication
  entities:
    - name: Profile
      description: Application profile of an authenticated user (mirrors auth.users)
      fields:
        - name: id
          type: uuid
          required: true
          description: Primary key, equals auth.users.id
          references:
            external: auth.users
            column: id
            onDelete: cascade
        - name: email
          type: string
          required: true
          description: User email address
        - name: name
          type: string
          required: false
          description: Display name
        - name: createdAt
          type: timestamp
          required: true
          description: Creation timestamp
          generate: now
      access:
        scope: owner
        field: id
  permissions:
    - name: auth.read
      description: Read auth details
    - name: auth.write
      description: Modify auth details
  api:
    - name: Login
      path: /api/auth/login
      method: POST
      description: Authenticate a user with email and password.
      behavior: auth.login
    - name: Logout
      path: /api/auth/logout
      method: POST
      description: Invalidate the active session.
      behavior: auth.logout
    - name: ResetPassword
      path: /api/auth/reset-password
      method: POST
      description: Request password reset.
      behavior: auth.reset-password
  ui:
    - name: LoginPage
      route: auth/login
      slot: main
      description: Standard user login page.
    - name: ResetPasswordPage
      route: auth/reset-password
      slot: main
      description: Standard password reset page.
requires:
  features:
    - database
