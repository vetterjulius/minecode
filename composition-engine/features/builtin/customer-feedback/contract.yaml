provides:
  capabilities:
    - customer-feedback
  entities:
    - name: Feedback
      description: Customer satisfaction rating and text feedback
      fields:
        - name: id
          type: uuid
          required: true
          description: Primary key
          generate: uuid
        - name: rating
          type: integer
          required: true
          description: Satisfaction rating score (1-5)
        - name: comment
          type: string
          required: false
          description: Customer comments text
        - name: userId
          type: uuid
          required: true
          description: Reference to User
          references:
            entity: Profile
            onDelete: cascade
        - name: organizationId
          type: uuid
          required: true
          description: Reference to Organization
          references:
            entity: Organization
            onDelete: cascade
        - name: createdAt
          type: timestamp
          required: true
          description: Timestamp of feedback submission
          generate: now
      access:
        scope: tenant
        field: organizationId
        permissions:
          read: feedback.read
          write: feedback.write
  permissions:
    - name: feedback.read
      description: Read organization feedback ratings
    - name: feedback.write
      description: Submit feedback ratings
  api:
    - name: ListFeedback
      path: /api/feedback
      method: GET
      description: List customer feedback entries.
      crud:
        entity: Feedback
        operation: list
      permission: feedback.read
    - name: PostFeedback
      path: /api/feedback
      method: POST
      description: Submit customer satisfaction feedback.
      crud:
        entity: Feedback
        operation: create
      permission: feedback.write
  ui:
    - name: FeedbackDashboard
      route: feedback
      slot: main
      description: Analytics dashboard of customer feedback scores.
requires:
  features:
    - database
    - organizations
