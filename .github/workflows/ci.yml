name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.3.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Run linter
        run: pnpm lint

      - name: Build packages and apps
        run: pnpm build

      - name: Check generated examples are up to date
        run: git diff --exit-code -- composition-engine/examples

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Verify generated apps typecheck and build
        run: pnpm verify:examples
